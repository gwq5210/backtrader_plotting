[tool.poetry]
name = "backtrader_plotting"
version = "2.0.1"
description = "Plotting package for Backtrader (Bokeh)"
authors = ["verybadsolider <vbs@springrts.de>"]
license = "GPLv3+"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.6"
backtrader = ">=1.9.78"
bokeh = ">=3.8.2"
jinja2 = ">=3.1.6"
pandas = ">=3.0.0"
matplotlib = ">=3.10.8"
markdown2 = ">=2.5.4"

[tool.poetry.dev-dependencies]


[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
